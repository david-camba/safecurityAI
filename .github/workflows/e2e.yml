name: E2E (Playwright)

on:
  push:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'run.py'
      - '.github/workflows/**' 
  pull_request:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'run.py'
      - '.github/workflows/**' 

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Required for the background backend server and API calls
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'poetry'

      - name: Install Python dependencies
        run: poetry install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci

      # Cache heavy Playwright browser binaries
      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright OS dependencies
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install

      # Start backend as a background process
      - name: Start backend server
        run: poetry run python run.py &

      # Vite dev server lifecycle is handled internally by Playwright configuration
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test --workers=3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7