name: E2E (Playwright) Tests

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'run.py'
      - '.github/workflows/**' 

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Required for the background backend server and API calls
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Poetry
        uses: ./.github/actions/setup-python-poetry

      - name: Setup Node.js & NPM
        uses: ./.github/actions/setup-node-npm

      # Cache heavy Playwright browser binaries
      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright OS dependencies
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install

      # Start backend as a background process
      - name: Start backend server
        run: poetry run python run.py &

      # Vite dev server lifecycle is handled internally by Playwright configuration
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test --workers=3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7