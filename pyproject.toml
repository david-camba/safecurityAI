[project]
name = "safecurityai"
package-mode = false
version = "0.1.0"
description = ""
authors = [
    {name = "davidcamba",email = "davidcamba@msn.com"}
]
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langgraph (>=1.1.3,<2.0.0)",
    "langchain-google-genai (>=4.2.1,<5.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.7,<0.16.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-sugar (>=1.1.1,<2.0.0)",
    "respx (>=0.22.0,<0.23.0)"
]
